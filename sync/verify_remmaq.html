<!DOCTYPE html>
<html>
<head>
    <title>REMMAQ Verification</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .check { padding: 10px; margin: 10px 0; border-left: 4px solid; border-radius: 3px; }
        .pass { background: #d4edda; border-color: #28a745; color: #155724; }
        .fail { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>REMMAQ Verification</h1>
    <div id="results"></div>

    <script>
    async function verify() {
        const results = document.getElementById('results');
        
        // Check 1: Can we access the index?
        try {
            const response = await fetch('precomputed/sites_index.json');
            if (response.ok) {
                const index = await response.json();
                const remmaq = index.filter(s => s.sources && s.sources.includes('remmaq'));
                results.innerHTML += `<div class="check pass">✓ Index loaded: ${index.length} sites, ${remmaq.length} REMMAQ</div>`;
                
                // Check 2: Can we access a REMMAQ file?
                if (remmaq.length > 0) {
                    const fileResp = await fetch(`precomputed/all_dts/${remmaq[0].file}`);
                    if (fileResp.ok) {
                        const data = await fileResp.json();
                        results.innerHTML += `<div class="check pass">✓ REMMAQ file loaded: ${data.forecasts.length} forecasts in ${remmaq[0].location_name}</div>`;
                        
                        // Check 3: Do we have AQI values?
                        const lastFc = data.forecasts[data.forecasts.length - 1];
                        if (lastFc.no2_aqi || lastFc.pm25_aqi) {
                            results.innerHTML += `<div class="check pass">✓ AQI data present: NO2=${lastFc.no2_aqi}, PM2.5=${lastFc.pm25_aqi}</div>`;
                        } else {
                            results.innerHTML += `<div class="check fail">✗ No AQI data found</div>`;
                        }
                    } else {
                        results.innerHTML += `<div class="check fail">✗ Cannot load REMMAQ file: ${fileResp.status}</div>`;
                    }
                }
            } else {
                results.innerHTML += `<div class="check fail">✗ Cannot load index: ${response.status}</div>`;
            }
        } catch (e) {
            results.innerHTML += `<div class="check fail">✗ Error: ${e.message}</div>`;
        }
        
        results.innerHTML += `<div style="margin-top:20px; padding:10px; background:#f0f0f0;">All checks completed. The data pipeline is ready for the main application.</div>`;
    }
    
    window.addEventListener('load', verify);
    </script>
</body>
</html>
