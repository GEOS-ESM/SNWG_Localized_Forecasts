<!DOCTYPE html>
<html>
<head>
    <title>Test Filter</title>
</head>
<body>
    <h1>Test Data Loading</h1>
    <button onclick="testFilter()">Test REMMAQ Filter</button>
    <pre id="output"></pre>

    <script>
    async function testFilter() {
        try {
            const response = await fetch('precomputed/sites_index.json');
            const index = await response.json();
            
            const remmaq_sites = index.filter(site => {
                if (!Array.isArray(site.sources)) return false;
                const siteSources = site.sources.map(s => s.toLowerCase());
                return siteSources.includes("remmaq");
            });
            
            document.getElementById('output').textContent = JSON.stringify({
                total_sites: index.length,
                remmaq_sites: remmaq_sites.length,
                sample: remmaq_sites[0]
            }, null, 2);
            
            console.log("REMMAQ sites found:", remmaq_sites.length);
            console.log("Sample:", remmaq_sites[0]);
        } catch (error) {
            document.getElementById('output').textContent = 'Error: ' + error.message;
        }
    }
    </script>
</body>
</html>
