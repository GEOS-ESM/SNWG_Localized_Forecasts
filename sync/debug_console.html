<!DOCTYPE html>
<html>
<head>
    <title>Debug Console</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="parametres/lf-style.css" rel="stylesheet" />
    <style>
        body { background: #1a1a1a; color: #fff; font-family: monospace; }
        #console { background: #222; border: 1px solid #555; padding: 10px; height: 500px; overflow-y: auto; margin: 10px; border-radius: 5px; }
        .log { color: #0f0; } .error { color: #f00; } .warn { color: #ff0; }
        button { padding: 10px 20px; margin: 10px; background: #007; color: #fff; border: none; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Debug Console</h1>
    <button onclick="testREMMAQ()">Test REMMAQ Load</button>
    <button onclick="clearConsole()">Clear</button>
    <div id="console"></div>

    <script>
        const origLog = console.log;
        const origError = console.error;
        const origWarn = console.warn;
        
        function logToPage(msg, cls = 'log') {
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = msg;
            document.getElementById('console').appendChild(line);
            document.getElementById('console').scrollTop = document.getElementById('console').scrollHeight;
        }
        
        console.log = function(...args) {
            origLog(...args);
            logToPage(args.join(' '), 'log');
        };
        console.error = function(...args) {
            origError(...args);
            logToPage('ERROR: ' + args.join(' '), 'error');
        };
        console.warn = function(...args) {
            origWarn(...args);
            logToPage('WARN: ' + args.join(' '), 'warn');
        };
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }
        
        async function testREMMAQ() {
            console.log("Testing REMMAQ loading...");
            
            try {
                const response = await fetch('precomputed/sites_index.json');
                const index = await response.json();
                console.log(`Loaded index with ${index.length} sites`);
                
                const remmaq = index.filter(s => {
                    if (!Array.isArray(s.sources)) return false;
                    return s.sources.map(x => x.toLowerCase()).includes("remmaq");
                });
                console.log(`Found ${remmaq.length} REMMAQ sites`);
                
                if (remmaq.length > 0) {
                    console.log(`First REMMAQ: ${remmaq[0].location_name}`);
                    
                    // Try to load the first site's forecast file
                    const fileResp = await fetch(`precomputed/all_dts/${remmaq[0].file}`);
                    const siteData = await fileResp.json();
                    console.log(`Loaded site file with ${siteData.forecasts.length} forecasts`);
                    console.log(`Latest forecast: ${JSON.stringify(siteData.forecasts[siteData.forecasts.length-1])}`);
                }
            } catch (error) {
                console.error("Test failed: " + error.message);
            }
        }
    </script>
</body>
</html>
