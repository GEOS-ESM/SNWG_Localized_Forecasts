
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-1.12.0.min.js"></script>
<style>
.forecasts-box {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.forecasts-box .modal-dialog {
    margin: 0;
    max-width: 100%;
    height: 100%;
}

.forecasts-box .modal-content {
    border: none;
    border-radius: 0;
    height: 100%;
    background: #fff;
}

.forecasts-box .modal-body {
    padding: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

.forecasts-box .actions_xgj {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.forecasts-box .btn-close {
    background-size: 12px;
    opacity: 0.5;
    padding: 8px;
}

.forecasts-box .more-info-btn {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
}

.forecast-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #f0f0f0;
}

.forecast-header .location-name {
    font-size: 28px;
    font-weight: 700;
    color: #000;
    margin: 0 0 4px 0;
    line-height: 1.2;
}

.forecast-header .forecast-meta {
    font-size: 12px;
    color: #666;
    margin-bottom: 16px;
}

.aqi-hero {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
}

.aqi-hero .aqi-value-main {
    font-size: 48px;
    font-weight: 700;
    color: #000;
    line-height: 1;
    animation: hero-aqi-pulse 2s ease-in-out infinite;
}

@keyframes hero-aqi-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.55; }
}

.aqi-hero .aqi-change {
    font-size: 16px;
    font-weight: 500;
}

.aqi-hero .aqi-change.positive { color: #d32f2f; }
.aqi-hero .aqi-change.negative { color: #388e3c; }

.aqi-hero .aqi-level-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
}

.forecast-header .aqi-subtitle {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
}

.forecast-periods {
    display: flex;
    gap: 4px;
    padding: 12px 24px;
    background: #fafafa;
    border-bottom: 1px solid #e5e5e5;
}

.forecast-periods .period-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.2s;
}

.forecast-periods .period-btn:hover {
    background: #e8e8e8;
}

.forecast-periods .period-btn.active {
    background: #000;
    color: #fff;
}

.forecast-grid {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 0;
    background: #e5e5e5;
    margin: 0;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.forecast-grid::-webkit-scrollbar { display: none; }

.forecast-card {
    background: #fff;
    padding: 16px 12px;
    text-align: center;
    flex: 0 0 80px;
    min-width: 80px;
    scroll-snap-align: start;
    border-right: 1px solid #e5e5e5;
}

/* Current-hour card blink */
.forecast-card.forecast-card-now {
    background: #f0f7ff;
    border-right: 1px solid #b3d4ff;
    position: relative;
}
.forecast-card.forecast-card-now::before {
    content: '';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #1565C0;
    animation: card-now-blink 1.4s ease-in-out infinite;
}
.forecast-card.forecast-card-now .card-time {
    color: #1565C0;
    font-weight: 700;
}
.forecast-card.forecast-card-now .card-aqi {
    animation: card-aqi-pulse 1.4s ease-in-out infinite;
}

@keyframes card-now-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.25; transform: scale(0.6); }
}
@keyframes card-aqi-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.6; }
}

.forecast-card .card-time {
    font-size: 12px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
}

.forecast-card .card-aqi {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
}

.forecast-card .card-level {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.card-met {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 10px;
    color: #888;
    flex-wrap: wrap;
}

.card-met span {
    display: flex;
    align-items: center;
    gap: 2px;
}

.card-met i {
    font-size: 11px;
    opacity: 0.7;
}

.forecast-date-header {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    background: #f0f0f0;
    border-right: 1px solid #ddd;
    padding: 8px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    padding: 10px 12px 4px;
    background: #f5f5f5;
    border-top: 1px solid #e5e5e5;
}

.daily-summary {
    padding: 16px 24px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
}

.daily-summary h6 {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 12px 0;
}

.daily-row {
    display: flex;
    gap: 16px;
}

.daily-item {
    flex: 1;
    padding: 12px;
    background: #f8f9fa;
    border-radius: 8px;
    text-align: center;
}

.daily-item .day-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

.daily-item .day-aqi {
    font-size: 20px;
    font-weight: 700;
}

.daily-item .day-change {
    font-size: 11px;
    margin-top: 4px;
}

.daily-item .day-change.up { color: #d32f2f; }
.daily-item .day-change.down { color: #388e3c; }

/* Mini bar chart */
.mini-barchart {
    padding: 14px 20px 4px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
}
.mini-barchart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
}
.mini-barchart-title {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex: 1;
    margin: 0;
}
.chart-toggle {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
}
.chart-toggle-btn {
    background: #fff;
    border: none;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    line-height: 1.4;
    transition: background 0.15s, color 0.15s;
}
.chart-toggle-btn + .chart-toggle-btn {
    border-left: 1px solid #ddd;
}
.chart-toggle-btn.active {
    background: #1565C0;
    color: #fff;
}
.mini-barchart-inner {
    display: flex;
    gap: 4px;
    align-items: stretch;
}

.mini-barchart-yscale {
    position: relative;
    width: 28px;
    flex-shrink: 0;
    height: 130px;
}
.yscale-tick {
    position: absolute;
    left: 0;
    transform: translateY(50%);
    font-size: 9px;
    color: #bbb;
    text-align: right;
    width: 100%;
    line-height: 1;
}

.mini-barchart-area {
    flex: 1;
    position: relative;
    height: 130px;
    overflow: visible;
}
.mini-grid-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #e8e8e8;
    pointer-events: none;
}
/* Bars row */
.mini-barchart-bars {
    display: flex;
    align-items: flex-end;
    height: 130px;
    gap: 1px;
    overflow: visible;
}
.mini-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    flex: 1;
    min-width: 6px;
    height: 100%;
    position: relative;
    cursor: default;
}
.mini-bar-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    height: 100%;
}
.mini-bar {
    width: 70%;
    border-radius: 1px;
    min-height: 3px;
    transition: opacity 0.2s;
}
.mini-bar-wrap:hover .mini-bar { opacity: 0.75; }

.mini-bar-blink {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid #fff;
    animation: blink-dot 1.2s ease-in-out infinite;
}
@keyframes blink-dot {
    0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
    50%       { opacity: 0.3; transform: translateX(-50%) scale(0.7); }
}

.mini-bar-wrap.mini-bar-now .mini-bar {
    outline: 2px solid rgba(0,0,0,0.35);
    outline-offset: 1px;
}

.mini-bar-xlabel {
    position: absolute;
    bottom: -16px;
    font-size: 9px;
    color: #aaa;
    white-space: nowrap;
    pointer-events: none;
}
/* X-axis legend */
.mini-barchart-xlegend {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    font-size: 10px;
    color: #bbb;
    padding-bottom: 6px;
}
/* Source legend */
.mini-source-legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.source-legend-label {
    font-size: 10px;
    color: #aaa;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}
.source-chip {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    border: 1.5px solid;
    background: transparent;
    letter-spacing: 0.3px;
}

.mini-stat-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1.5px dashed #555;
    pointer-events: none;
    z-index: 2;
}
.mini-stat-line-epa {
    border-top-color: #2E7D32;
}
.mini-stat-line-epa .mini-stat-label {
    color: #2E7D32;
    left: auto;
    right: 3px;
}
.mini-stat-label {
    position: absolute;
    left: 3px;
    top: -16px;
    font-size: 10px;
    font-weight: 700;
    color: #111;
    background: rgba(255,255,255,0.92);
    padding: 0 3px;
    border-radius: 2px;
    line-height: 1.4;
    white-space: nowrap;
    letter-spacing: 0.2px;
}


.plot_description,
div#plot_pm25_aqi,
.download_plot_data,
.aqi-multi-hour-box,
.xvg_aqi-container,
.module_title,
.sub-title,
.model_data {
    display: none !important;
}


.thewindow,
ul#pills-tab,
#pills-tab {
    display: block !important;
}

.tab-pane {
    display: none !important;
}


.tab-pane.show.active {
    display: block !important;
}

.tab-pane.show.active .plot-container,
.tab-pane.show.active .frcst-plt-dets {
    display: block !important;
}

.tab-content {

</style>
<div class="forecasts-box">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content">
            <div class="actions_xgj">
                <a class="btn btn-outline-primary more-info-btn" target="_blank" href="">
                    <i class="bi bi-info-circle"></i> More Information
                </a>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body">
                <div id="forecast-hero-section"></div>
                <div class="forecasts-view row" style="display:none;">
                    <h3 class="module_title location_parameter_name"></h3>
                    <h1 class="sub-title site-name"><span class="current_location_name"></span></h1>
                    <div class="thewindow">
                        <div class="row local_forecats_window"></div>
                        <div class="tab-content" id="pills-tabContent"></div>
                    </div>
                </div>
                <div class="model_data"></div>
            </div>
        </div>
    </div>
</div>
    
<script src='parametres/plotly-2.12.1.min.js'></script>
<script>
    const moreInfoBtn = document.querySelector('.more-info-btn');
    const locationNameElem = document.querySelector('.current_location_name');
    if (moreInfoBtn && locationNameElem) {
        function updateMoreInfoLink() {
            const locationName = locationNameElem.textContent.trim();
            if (locationName) {
                const baseUrl = window.location.origin + window.location.pathname.replace(/location\.html.*$/, "site.html");
                moreInfoBtn.href = `${baseUrl}?site=${encodeURIComponent(locationName)}`;
            }
        }
        updateMoreInfoLink();
        const observer = new MutationObserver(updateMoreInfoLink);
        observer.observe(locationNameElem, { childList: true, subtree: true, characterData: true });
    }


    function injectAqiScaleTab() {
        const tabsList = document.getElementById('pills-tab');
        const tabContent = document.getElementById('pills-tabContent');
        if (!tabsList || !tabContent) return;
        if (document.getElementById('tab-aqi-scale')) return;

        const tabId = 'aqi-scale';
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.setAttribute('role', 'presentation');
        li.innerHTML = `<a class="nav-link" id="tab-${tabId}" data-bs-toggle="pill" href="#${tabId}" role="tab" aria-controls="${tabId}" aria-selected="false">AQI Scale</a>`;
        tabsList.appendChild(li);

        const pollutants = [
            {
                abbr: 'NO₂', name: 'Nitrogen Dioxide',
                color: '#1565C0',
                source: 'NASA SNWG bias-corrected model + GEOS-CF',
                desc: 'Produced mainly by vehicle engines and fossil fuel combustion. Exposure can irritate the respiratory tract, worsen asthma and lung diseases, and contribute to the formation of ground-level ozone and fine particles.',
                unit: 'ppbv',
                standard: 'EPA 1-hour NAAQS: 100 ppb (AQI 100)'
            },
            {
                abbr: 'PM2.5', name: 'Fine Particulate Matter',
                color: '#2E7D32',
                source: 'NASA GEOS-FP + CNN Machine Learning',
                desc: 'Tiny particles (≤2.5 µm) from combustion, dust, and secondary reactions. They penetrate deep into the lungs and bloodstream, increasing risk of respiratory and cardiovascular disease, especially with long-term exposure.',
                unit: 'µg/m³',
                standard: 'EPA 24-hour NAAQS: 35 µg/m³ (AQI 100)'
            },
            {
                abbr: 'O₃', name: 'Ozone',
                color: '#E65100',
                source: 'NASA GEOS-CF',
                desc: 'Ground-level ozone forms when NOx and VOCs react in sunlight. It irritates the airways, worsens asthma and chronic lung disease, and can reduce lung function even in healthy individuals during outdoor exertion.',
                unit: 'ppbv',
                standard: 'EPA 8-hour NAAQS: 0.070 ppm (AQI 100)'
            }
        ];

        const pollutantCards = pollutants.map(p => `
            <div style="display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #f0f0f0;">
                <div style="flex-shrink:0;width:48px;height:48px;border-radius:8px;background:${p.color}18;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:${p.color};text-align:center;line-height:1.2;">${p.abbr}</div>
                <div style="flex:1;">
                    <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:2px;">${p.name} <span style="font-size:11px;font-weight:500;color:#888;">(${p.unit})</span></div>
                    <div style="font-size:11px;color:#888;margin-bottom:5px;">Source: ${p.source}</div>
                    <div style="font-size:12px;color:#444;line-height:1.55;margin-bottom:4px;">${p.desc}</div>
                    <div style="font-size:11px;color:${p.color};font-weight:600;">${p.standard}</div>
                </div>
            </div>`).join('');

        const scales = [
            { range: '0–50',    level: 'Good',                           color: '#4CAF50', textColor: '#fff',
              who: 'Air quality is satisfactory and poses little or no risk.',
              sensitive: 'No precautions needed.',
              general: 'Enjoy outdoor activities.' },
            { range: '51–100',  level: 'Moderate',                       color: '#FFEB3B', textColor: '#333',
              who: 'Air quality is acceptable; some pollutants may concern a small number of people.',
              sensitive: 'Unusually sensitive individuals should consider reducing prolonged outdoor activity.',
              general: 'Active children and adults may consider reducing prolonged outdoor exertion.' },
            { range: '101–150', level: 'Unhealthy for Sensitive Groups',  color: '#FF9800', textColor: '#fff',
              who: 'Members of sensitive groups may experience health effects.',
              sensitive: 'People with heart or lung disease, older adults, and children should reduce heavy outdoor exertion.',
              general: 'General public is not likely to be affected.' },
            { range: '151–200', level: 'Unhealthy',                      color: '#F44336', textColor: '#fff',
              who: 'Everyone may begin to experience health effects.',
              sensitive: 'Sensitive groups should avoid prolonged outdoor exertion.',
              general: 'Everyone else should reduce prolonged or heavy outdoor exertion.' },
            { range: '201–300', level: 'Very Unhealthy',                  color: '#9C27B0', textColor: '#fff',
              who: 'Health alert: everyone may experience more serious health effects.',
              sensitive: 'Sensitive groups should avoid all outdoor activity.',
              general: 'Everyone should avoid prolonged or heavy outdoor exertion.' },
            { range: '301–500', level: 'Hazardous',                      color: '#7E0023', textColor: '#fff',
              who: 'Health warnings of emergency conditions.',
              sensitive: 'Everyone should avoid all outdoor activity.',
              general: 'Stay indoors and keep activity levels low.' },
        ];

        const scaleRows = scales.map(s => `
            <tr style="border-bottom:1px solid #f5f5f5;">
                <td style="padding:8px 10px;white-space:nowrap;">
                    <span style="display:inline-block;background:${s.color};color:${s.textColor};padding:3px 10px;border-radius:4px;font-weight:700;font-size:12px;">${s.range}</span>
                </td>
                <td style="padding:8px 10px;font-weight:600;color:${s.color === '#FFEB3B' ? '#555' : s.color};">${s.level}</td>
                <td style="padding:8px 10px;font-size:12px;color:#444;">${s.who}</td>
                <td style="padding:8px 10px;font-size:12px;color:#555;">${s.sensitive}</td>
                <td style="padding:8px 10px;font-size:12px;color:#555;">${s.general}</td>
            </tr>`).join('');

        const pane = document.createElement('div');
        pane.className = 'tab-pane fade';
        pane.id = tabId;
        pane.setAttribute('role', 'tabpanel');
        pane.setAttribute('aria-labelledby', `tab-${tabId}`);
        pane.innerHTML = `
            <div class="frcst-plt-dets" style="display:block!important;">
                <h2>Air Quality Information &amp; AQI Scale</h2>
                <p>Pollutant descriptions, data sources, and the US EPA Air Quality Index (AQI) health categories.</p>
            </div>
            <div style="margin-bottom:20px;">
                <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;">Pollutants Monitored</div>
                ${pollutantCards}
            </div>
            <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;">US AQI Health Categories</div>
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead>
                        <tr style="border-bottom:2px solid #e5e5e5;text-align:left;background:#fafafa;">
                            <th style="padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;">AQI</th>
                            <th style="padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Category</th>
                            <th style="padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Air Quality</th>
                            <th style="padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Sensitive Groups</th>
                            <th style="padding:8px 10px;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">General Public</th>
                        </tr>
                    </thead>
                    <tbody>${scaleRows}</tbody>
                </table>
            </div>`;
        tabContent.appendChild(pane);
    }


    const aqiScaleObserver = new MutationObserver(() => {
        const tabsList = document.getElementById('pills-tab');
        if (tabsList && tabsList.querySelectorAll('.nav-item').length > 0) {
            injectAqiScaleTab();
            aqiScaleObserver.disconnect();
        }
    });
    aqiScaleObserver.observe(document.body, { childList: true, subtree: true });
</script>
