
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-1.12.0.min.js"></script>
<style>
.forecasts-box {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.forecasts-box .modal-dialog {
    margin: 0;
    max-width: 100%;
    height: 100%;
}

.forecasts-box .modal-content {
    border: none;
    border-radius: 0;
    height: 100%;
    background: #fff;
}

.forecasts-box .modal-body {
    padding: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

.forecasts-box .actions_xgj {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.forecasts-box .btn-close {
    background-size: 12px;
    opacity: 0.5;
    padding: 8px;
}

.forecasts-box .more-info-btn {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
}

.forecast-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #f0f0f0;
}

.forecast-header .location-name {
    font-size: 28px;
    font-weight: 700;
    color: #000;
    margin: 0 0 4px 0;
    line-height: 1.2;
}

.forecast-header .forecast-meta {
    font-size: 12px;
    color: #666;
    margin-bottom: 16px;
}

.aqi-hero {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
}

.aqi-hero .aqi-value-main {
    font-size: 48px;
    font-weight: 700;
    color: #000;
    line-height: 1;
}

.aqi-hero .aqi-change {
    font-size: 16px;
    font-weight: 500;
}

.aqi-hero .aqi-change.positive { color: #d32f2f; }
.aqi-hero .aqi-change.negative { color: #388e3c; }

.aqi-hero .aqi-level-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
}

.forecast-header .aqi-subtitle {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
}

.forecast-periods {
    display: flex;
    gap: 4px;
    padding: 12px 24px;
    background: #fafafa;
    border-bottom: 1px solid #e5e5e5;
}

.forecast-periods .period-btn {
    padding: 8px 16px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.2s;
}

.forecast-periods .period-btn:hover {
    background: #e8e8e8;
}

.forecast-periods .period-btn.active {
    background: #000;
    color: #fff;
}

.forecast-grid {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 0;
    background: #e5e5e5;
    margin: 0;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.forecast-grid::-webkit-scrollbar { display: none; }

.forecast-card {
    background: #fff;
    padding: 16px 12px;
    text-align: center;
    flex: 0 0 80px;
    min-width: 80px;
    scroll-snap-align: start;
    border-right: 1px solid #e5e5e5;
}

.forecast-card .card-time {
    font-size: 12px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
}

.forecast-card .card-aqi {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
}

.forecast-card .card-level {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.card-met {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 10px;
    color: #888;
    flex-wrap: wrap;
}

.card-met span {
    display: flex;
    align-items: center;
    gap: 2px;
}

.card-met i {
    font-size: 11px;
    opacity: 0.7;
}

.forecast-date-header {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    background: #f0f0f0;
    border-right: 1px solid #ddd;
    padding: 8px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    padding: 10px 12px 4px;
    background: #f5f5f5;
    border-top: 1px solid #e5e5e5;
}

.daily-summary {
    padding: 16px 24px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
}

.daily-summary h6 {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 12px 0;
}

.daily-row {
    display: flex;
    gap: 16px;
}

.daily-item {
    flex: 1;
    padding: 12px;
    background: #f8f9fa;
    border-radius: 8px;
    text-align: center;
}

.daily-item .day-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

.daily-item .day-aqi {
    font-size: 20px;
    font-weight: 700;
}

.daily-item .day-change {
    font-size: 11px;
    margin-top: 4px;
}

.daily-item .day-change.up { color: #d32f2f; }
.daily-item .day-change.down { color: #388e3c; }

/* Mini bar chart */
.mini-barchart {
    padding: 14px 20px 4px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
}
.mini-barchart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
}
.mini-barchart-title {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex: 1;
    margin: 0;
}
.chart-toggle {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
}
.chart-toggle-btn {
    background: #fff;
    border: none;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    line-height: 1.4;
    transition: background 0.15s, color 0.15s;
}
.chart-toggle-btn + .chart-toggle-btn {
    border-left: 1px solid #ddd;
}
.chart-toggle-btn.active {
    background: #1565C0;
    color: #fff;
}
.mini-barchart-inner {
    display: flex;
    gap: 4px;
    align-items: stretch;
}
/* Y-axis */
.mini-barchart-yscale {
    position: relative;
    width: 28px;
    flex-shrink: 0;
    height: 130px;
}
.yscale-tick {
    position: absolute;
    left: 0;
    transform: translateY(50%);
    font-size: 9px;
    color: #bbb;
    text-align: right;
    width: 100%;
    line-height: 1;
}
/* Chart area */
.mini-barchart-area {
    flex: 1;
    position: relative;
    height: 130px;
    overflow: visible;
}
.mini-grid-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #e8e8e8;
    pointer-events: none;
}
/* Bars row */
.mini-barchart-bars {
    display: flex;
    align-items: flex-end;
    height: 130px;
    gap: 1px;
    overflow: visible;
}
.mini-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    flex: 1;
    min-width: 6px;
    height: 100%;
    position: relative;
    cursor: default;
}
.mini-bar-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
    height: 100%;
}
.mini-bar {
    width: 70%;
    border-radius: 1px;
    min-height: 3px;
    transition: opacity 0.2s;
}
.mini-bar-wrap:hover .mini-bar { opacity: 0.75; }
/* Blinking dot on current bar */
.mini-bar-blink {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid #fff;
    animation: blink-dot 1.2s ease-in-out infinite;
}
@keyframes blink-dot {
    0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
    50%       { opacity: 0.3; transform: translateX(-50%) scale(0.7); }
}
/* Now bar border */
.mini-bar-wrap.mini-bar-now .mini-bar {
    outline: 2px solid rgba(0,0,0,0.35);
    outline-offset: 1px;
}
/* X-axis label */
.mini-bar-xlabel {
    position: absolute;
    bottom: -16px;
    font-size: 9px;
    color: #aaa;
    white-space: nowrap;
    pointer-events: none;
}
/* X-axis legend */
.mini-barchart-xlegend {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    font-size: 10px;
    color: #bbb;
    padding-bottom: 6px;
}
/* Source legend */
.mini-source-legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.source-legend-label {
    font-size: 10px;
    color: #aaa;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}
.source-chip {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    border: 1.5px solid;
    background: transparent;
    letter-spacing: 0.3px;
}

.mini-stat-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1.5px dashed #555;
    pointer-events: none;
    z-index: 2;
}
.mini-stat-line-epa {
    border-top-color: #2E7D32;
}
.mini-stat-line-epa .mini-stat-label {
    color: #2E7D32;
    left: auto;
    right: 3px;
}
.mini-stat-label {
    position: absolute;
    left: 3px;
    top: -16px;
    font-size: 10px;
    font-weight: 700;
    color: #111;
    background: rgba(255,255,255,0.92);
    padding: 0 3px;
    border-radius: 2px;
    line-height: 1.4;
    white-space: nowrap;
    letter-spacing: 0.2px;
}

ul#pills-tab,
.plot_description,
div#plot_pm25_aqi,
.plot-container,
.frcst-plt-dets,
.download_plot_data,
.aqi-multi-hour-box,
.xvg_aqi-container,
.module_title,
.sub-title,
.thewindow,
.model_data {
    display: none !important;
}

.tab-content {
    padding: 0;
}

.tab-pane {
    padding: 0;
}

</style>
<div class="forecasts-box">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content">
            <div class="actions_xgj">
                <a class="btn btn-outline-primary more-info-btn" target="_blank" href="">
                    <i class="bi bi-info-circle"></i> More Information
                </a>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body">
                <div id="forecast-hero-section"></div>

                    <h3 class="module_title location_parameter_name"></h3>
                    <h1 class="sub-title site-name"><span class="current_location_name"></span></h1>
                    <div class="thewindow">
                        <div class="row local_forecats_window"></div>

            </div>
        </div>
    </div>
</div>
    
<script src='parametres/plotly-2.12.1.min.js'></script>
<script>
    const moreInfoBtn = document.querySelector('.more-info-btn');
    const locationNameElem = document.querySelector('.current_location_name');
    if (moreInfoBtn && locationNameElem) {
        function updateMoreInfoLink() {
            const locationName = locationNameElem.textContent.trim();
            if (locationName) {
                const baseUrl = window.location.origin + window.location.pathname.replace(/location\.html.*$/, "site.html");
                moreInfoBtn.href = `${baseUrl}?site=${encodeURIComponent(locationName)}`;
            }
        }
        updateMoreInfoLink();
        const observer = new MutationObserver(updateMoreInfoLink);
        observer.observe(locationNameElem, { childList: true, subtree: true, characterData: true });
    }
</script>
