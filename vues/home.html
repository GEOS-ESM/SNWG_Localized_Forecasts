<section class="wrapper image-wrapper bg-image bg-overlay bg-overlay-300">
    <div id='map'></div>
    <div id="map-hover-info" style="display:none; position:absolute; z-index:99999; pointer-events:none; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.2); padding:8px; font-size:14px; min-width:120px;"></div>
    <div id='replay-animation'>
        <img src="geos-cf.gif"/>
    </div>
</section>



<div class="forecasts_container"></div>

<div class="locations-container snwg-banner">
    <div class="banner-controls">
        <div class="controls-left">
            <button id="toggle-locations-box" class="btn-banner-toggle" title="Show/Hide filters">
                <i class="bi bi-chevron-up" id="toggle-locations-icon"></i>
            </button>
            <div id="species-filter-container" class="filter-controls">
                <label for="species-filter">Locations:</label>
                <select id="species-filter" class="banner-select">
                    <option value="pandora">NASA Pandora</option>
                    <option value="dos_missions" selected>DoS Missions</option>
                    <option value="remaaq">REMAAQ</option>
                    <option value="aeronet">AERONET</option>
                    <option value="openaq">OpenAQ</option>
                </select>
            </div>
            <div id="location-search-container" class="search-controls">
                <input type="text" id="location-search-input" class="banner-search" placeholder="Search locations..." />
            </div>
        </div>
    </div>
    <div class="locations-box" data-margin="0" data-dots="false" data-items-md="5" data-items-xs="1">
        <div class="pollutants-banner-container">
            <div class="pollutant-banner-o swiper-desactivated"></div>
        </div>
    </div>
</div>
<script src="local_forecasts.js?v=1.4.0"></script>
<script src="local_forecasts_assets.js?v=1.4.0"></script>

<script>
    // Add home-page class to body for black background styling
    document.body.classList.add('home-page');
    $(document).on('click', '.btn-close', function(e) {
        $('.forecasts_container').css('display', 'none');
    });

$(document).on('change', '#species-filter', function() {
    cleanupBanners();
    const selectedSpecies = $(this).val();
    
    // Update URL with new filter
    const url = new URL(window.location);
    url.searchParams.set('filter', selectedSpecies);
    window.history.pushState({ filter: selectedSpecies }, '', url);
    
    // Use optimized filter update that keeps map without reloading
    readCompressedJsonAndAddBannersOptimized("precomputed/combined_forecasts.json.gz", selectedSpecies);
});
$(document).ready(function () {
    // Load filter from URL parameter if available
    const urlFilter = getUrlParam('filter');
    const defaultFilter = urlFilter || 'dos_missions';
    
    // Set the default filter in URL if not already present
    if (!urlFilter) {
        const url = new URL(window.location);
        url.searchParams.set('filter', defaultFilter);
        window.history.replaceState({ filter: defaultFilter }, '', url);
    }
    
    $('#species-filter').val(defaultFilter);
    
    readCompressedJsonAndAddBanners("precomputed/combined_forecasts.json.gz", defaultFilter);
    $('#toggle-locations-box-header').show();
});




    function getUrlParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    $(function() {
        const viewParam = getUrlParam('view');
        if (viewParam === 'list') {
            $('.locations-container').show();
            $('#toggle-locations-box').find('span').text('Hide Filters');
        } else if (viewParam === 'globe') {
            $('.locations-container').hide();
        }
        
        // Banner expanded by default
        let isExpanded = true;
        const $banner = $('.locations-container.snwg-banner');
        const $icon = $('#toggle-locations-icon');
        $banner.addClass('expanded');
        $icon.removeClass('bi-chevron-up').addClass('bi-chevron-down');
        
        $('#toggle-locations-box').on('click', function() {
            if (isExpanded) {
                // Collapse
                $banner.removeClass('expanded');
                $icon.removeClass('bi-chevron-down').addClass('bi-chevron-up');
            } else {
                // Expand
                $banner.addClass('expanded');
                $icon.removeClass('bi-chevron-up').addClass('bi-chevron-down');
            }
            isExpanded = !isExpanded;
        });

        // Listen for URL changes (browser back/forward buttons)
        window.addEventListener('popstate', function(event) {
            const urlFilter = getUrlParam('filter') || 'dos_missions';
            const currentFilter = $('#species-filter').val();
            
            // Only update if filter in URL is different from current
            if (urlFilter !== currentFilter) {
                $('#species-filter').val(urlFilter);
                cleanupBanners();
                readCompressedJsonAndAddBannersOptimized("precomputed/combined_forecasts.json.gz", urlFilter);
            }
        });

        // Monitor URL changes (including direct manual edits in address bar)
        let lastKnownFilter = getUrlParam('filter') || 'dos_missions';
        setInterval(function() {
            const currentUrlFilter = getUrlParam('filter') || 'dos_missions';
            const currentDropdownFilter = $('#species-filter').val();
            
            // If URL changed from last check and it's different from dropdown
            if (currentUrlFilter !== lastKnownFilter && currentUrlFilter !== currentDropdownFilter) {
                console.log('URL filter changed to:', currentUrlFilter);
                lastKnownFilter = currentUrlFilter;
                
                // Update dropdown and load new filter
                $('#species-filter').val(currentUrlFilter);
                cleanupBanners();
                readCompressedJsonAndAddBannersOptimized("precomputed/combined_forecasts.json.gz", currentUrlFilter);
            } else {
                // Just track the latest URL filter even if we don't update
                lastKnownFilter = currentUrlFilter;
            }
        }, 300);

        // Location search functionality
        $('#location-search-input').on('keyup', function() {
            const searchText = $(this).val().toLowerCase().trim();
            if (searchText === '') {
                // Show all locations
                $('.pollutant-banner').show();
            } else {
                // Filter locations by name - search in location-name element
                $('.pollutant-banner').each(function() {
                    const locationName = $(this).find('.location-name').text().toLowerCase();
                    if (locationName.includes(searchText)) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }
                });
            }
        });
    });

</script>
