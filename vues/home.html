<section class="wrapper image-wrapper bg-image bg-overlay bg-overlay-300">
    <div id='map'></div>
    <div id="map-hover-info" style="display:none; position:absolute; z-index:99999; pointer-events:none; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.2); padding:8px; font-size:14px; min-width:120px;"></div>
    
    <div id="map-controls-overlay" class="map-controls-panel collapsed">
        <div class="controls-header">
            <h3><i class="bi bi-gear-fill"></i> Map Controls</h3>
            <button id="toggle-map-controls" class="btn-controls-toggle" title="Toggle Controls">
                <i class="bi bi-chevron-left"></i>
            </button>
        </div>
        
        <div class="controls-body">
            <div class="control-section">
                <h4><i class="bi bi-eye"></i> Display Options</h4>
                <div class="control-group">
                    <label class="control-label">
                        <input type="checkbox" id="show-markers" checked>
                        <span>Show Markers</span>
                    </label>
                    <label class="control-label">
                        <input type="checkbox" id="show-labels" checked>
                        <span>Show Labels</span>
                    </label>
                    <label class="control-label">
                        <input type="checkbox" id="show-clusters">
                        <span>Enable Clustering</span>
                    </label>
                    <label class="control-label">
                        <input type="checkbox" id="show-banners">
                        <span>Show Location Banners</span>
                    </label>
                </div>
            </div>

            <div class="control-section">
                <h4><i class="bi bi-map"></i> Map Style</h4>
                <div class="control-group">
                    <label for="map-style">Base Map:</label>
                    <select id="map-style" class="control-select">
                        <option value="dark">Dark Matter</option>
                        <option value="light">Light</option>
                        <option value="voyager" selected>Voyager</option>
                        <option value="osm">OpenStreetMap</option>
                        <option value="satellite">Satellite (ESRI)</option>
                    </select>
                </div>
            </div>

            <div class="control-section">
                <h4><i class="bi bi-collection"></i> Marker Grouping</h4>
                <div class="control-group">
                    <label for="cluster-radius">Cluster Radius:</label>
                    <input type="range" id="cluster-radius" min="20" max="150" value="100" class="control-range">
                    <span id="cluster-radius-value" class="range-value">100px</span>
                </div>
                <div class="control-group">
                    <label for="marker-size">Marker Size:</label>
                    <input type="range" id="marker-size" min="16" max="48" value="32" class="control-range">
                    <span id="marker-size-value" class="range-value">32px</span>
                </div>
                <div class="control-group">
                    <label for="marker-opacity">Marker Opacity:</label>
                    <input type="range" id="marker-opacity" min="0.3" max="1" step="0.1" value="0.7" class="control-range">
                    <span id="marker-opacity-value" class="range-value">0.7</span>
                </div>
            </div>

            <div class="control-section">
                <h4><i class="bi bi-zoom-in"></i> View Controls</h4>
                <div class="control-group">
                    <button id="reset-view" class="control-btn">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset View
                    </button>
                    <button id="fit-bounds" class="control-btn">
                        <i class="bi bi-aspect-ratio"></i> Fit All Markers
                    </button>
                </div>
            </div>
            
            <div id="geotiff-controls-container"></div>
        </div>
    </div>

    <button id="map-controls-toggle-btn" title="Show Map Controls">
        <i class="bi bi-gear-fill"></i>
    </button>
    

    <div id='replay-animation'>
        <img src="geos-cf.gif"/>
    </div>
</section>



<div class="forecasts_container"></div>

<div class="locations-ticker-banner" id="locations-banner">

        <div class="ticker-nav-right">

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const scrollLeft = document.getElementById('ticker-scroll-left');
    const scrollRight = document.getElementById('ticker-scroll-right');
    const track = document.querySelector('.ticker-track-wrapper');
    
    if (scrollLeft && track) {
        scrollLeft.addEventListener('click', function() {
            track.scrollBy({ left: -300, behavior: 'smooth' });
        });
    }
    
    if (scrollRight && track) {
        scrollRight.addEventListener('click', function() {
            track.scrollBy({ left: 300, behavior: 'smooth' });
        });
    }
});
</script>

<script>
    document.body.classList.add('home-page');
    $(document).on('click', '.btn-close', function(e) {
        $('.forecasts_container').empty();
    });

$(document).on('change', '#species-filter', function() {
    cleanupBanners();
    const selectedSpecies = $(this).val();
    

    const url = new URL(window.location);
    url.searchParams.set('filter', selectedSpecies);
    window.history.pushState({ filter: selectedSpecies }, '', url);
    

    readCompressedJsonAndAddBannersOptimized("precomputed/combined_forecasts.json.gz", selectedSpecies);
});
$(document).ready(function () {

    const urlFilter = getUrlParam('filter');
    const defaultFilter = urlFilter || 'dos_missions';
    
    if (!urlFilter) {
        const url = new URL(window.location);
        url.searchParams.set('filter', defaultFilter);
        window.history.replaceState({ filter: defaultFilter }, '', url);
    }
    
    $('#species-filter').val(defaultFilter);
    
    readCompressedJsonAndAddBanners("precomputed/combined_forecasts.json.gz", defaultFilter);
    
    const initGeoTIFFManager = function() {
        if (typeof GeoTIFFManager === 'undefined') {
            console.warn('GeoTIFFManager not yet loaded, retrying...');
            setTimeout(initGeoTIFFManager, 500);
            return;
        }
        
        if (!window.currentMap) {
            console.log('Map not ready yet, retrying GeoTIFF Manager init...');
            setTimeout(initGeoTIFFManager, 500);
            return;
        }
        
        console.log('Initializing GeoTIFF Manager...');
        GeoTIFFManager.init({
            autoCreateControls: true
        }).then(function(result) {
            console.log('GeoTIFF Manager initialized successfully');
        }).catch(function(err) {
            console.error('GeoTIFF Manager initialization error:', err);
        });
    };
    

    setTimeout(initGeoTIFFManager, 2000);
});

    function getUrlParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    $(function() {
        const viewParam = getUrlParam('view');
        if (viewParam === 'list') {
            $('.locations-container').show();
        } else if (viewParam === 'globe') {
            $('.locations-container').hide();
        }


        window.addEventListener('popstate', function(event) {
            const urlFilter = getUrlParam('filter') || 'dos_missions';
            const currentFilter = $('#species-filter').val();
            

            if (urlFilter !== currentFilter) {
                $('#species-filter').val(urlFilter);
                cleanupBanners();
                readCompressedJsonAndAddBannersOptimized("precomputed/combined_forecasts.json.gz", urlFilter);
            }
        });

        let searchTimeout;
        $(document).on('keyup', '#location-search-input', function() {
            const input = this;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                const searchText = $(input).val().toLowerCase().trim();
                const $allCards = $('.ticker-track .ticker-card');
                
                if (searchText === '') {
                    $allCards.css('display', '');
                } else {
                    $allCards.each(function() {
                        const $card = $(this);
                        const locationName = $card.find('.ticker-card-name').text().toLowerCase();
                        
                        if (locationName.includes(searchText)) {
                            $card.css('display', 'flex');
                        } else {
                            $card.css('display', 'none');
                        }
                    });
                }
            }, 150); // 150ms debounce
        });
        
        $(document).on('change', '#species-filter', function() {
            $('#location-search-input').val('');
            $('.ticker-track .ticker-card').css('display', '');
        });
        

        $('#toggle-map-controls, #map-controls-toggle-btn').on('click', function() {
            $('#map-controls-overlay').toggleClass('collapsed');
        });
        

        $('#show-markers').on('change', function() {
            if (window.currentMarkers) {
                if ($(this).is(':checked')) {
                    if (window.currentMap && !window.currentMap.hasLayer(window.currentMarkers)) {
                        window.currentMap.addLayer(window.currentMarkers);
                    }
                } else {
                    if (window.currentMap && window.currentMap.hasLayer(window.currentMarkers)) {
                        window.currentMap.removeLayer(window.currentMarkers);
                    }
                }
            }
        });
        
        $('#show-labels').on('change', function() {
            const showLabels = $(this).is(':checked');
            $('.marker-container').each(function() {
                if (showLabels) {
                    $(this).css('font-size', '11px');
                } else {
                    $(this).css('font-size', '0');
                }
            });
        });
        
        $('#show-banners').on('change', function() {
            console.log('Show banners checkbox changed:', $(this).is(':checked'));
            const showBanners = $(this).is(':checked');
            const $banner = $('.locations-container.snwg-banner');
            
            console.log('Banner element found:', $banner.length);
            
            if (showBanners) {
                console.log('Showing banner...');
                $banner.removeClass('hidden');
            } else {
                console.log('Hiding banner...');
                $banner.addClass('hidden');
            }
        });
        
        $('#show-clusters').on('change', function() {
            const enableClustering = $(this).is(':checked');
            if (window.currentForecastData) {
                const geojson = sitesArrayToGeoJSON(window.currentForecastData);

                window.mapSettings = window.mapSettings || {};
                window.mapSettings.clusteringEnabled = enableClustering;
                
                if (window.currentMap && window.currentMarkers) {
                    window.currentMap.removeLayer(window.currentMarkers);
                    
                    if (enableClustering) {
                        const clusterRadius = parseInt($('#cluster-radius').val()) || 100;
                        window.currentMarkers = L.markerClusterGroup({
                            maxClusterRadius: clusterRadius,
                            spiderfyOnMaxZoom: true,
                            showCoverageOnHover: false,
                            zoomToBoundsOnClick: true,
                            iconCreateFunction: function(cluster) {
                                var count = cluster.getChildCount();
                                var size = count > 100 ? 40 : (count > 10 ? 30 : 20);
                                return L.divIcon({
                                    html: '<div style="background:#1da1f2;color:#fff;border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;">' + count + '</div>',
                                    className: 'custom-cluster-icon',
                                    iconSize: L.point(size, size)
                                });
                            }
                        });
                    } else {
                        window.currentMarkers = L.layerGroup();
                    }
                    
                    window.currentMap.addLayer(window.currentMarkers);
                    updateLeafletMarkers(window.currentMap, geojson);
                }
            }
        });
        

        $('#map-style').on('change', function() {
            const style = $(this).val();
            if (window.currentMap && window.currentTileLayer) {
                window.currentMap.removeLayer(window.currentTileLayer);
            }
            
            let tileUrl, attribution;
            
            switch(style) {
                case 'dark':
                    tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
                    attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
                    break;
                case 'light':
                    tileUrl = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                    attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
                    break;
                case 'voyager':
                    tileUrl = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
                    attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
                    break;
                case 'osm':
                    tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
                    attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
                    break;
                case 'satellite':
                    tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
                    attribution = 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community';
                    break;
            }
            
            if (window.currentMap) {
                window.currentTileLayer = L.tileLayer(tileUrl, {
                    attribution: attribution,
                    subdomains: 'abcd',
                    maxZoom: 20,
                    noWrap: true
                }).addTo(window.currentMap);
            }
        });
        
        $('#cluster-radius').on('input', function() {
            const value = $(this).val();
            $('#cluster-radius-value').text(value + 'px');
            
            if ($('#show-clusters').is(':checked') && window.currentForecastData) {
                const geojson = sitesArrayToGeoJSON(window.currentForecastData);
                
                if (window.currentMap && window.currentMarkers) {
                    window.currentMap.removeLayer(window.currentMarkers);
                    
                    window.currentMarkers = L.markerClusterGroup({
                        maxClusterRadius: parseInt(value),
                        spiderfyOnMaxZoom: true,
                        showCoverageOnHover: false,
                        zoomToBoundsOnClick: true,
                        iconCreateFunction: function(cluster) {
                            var count = cluster.getChildCount();
                            var size = count > 100 ? 40 : (count > 10 ? 30 : 20);
                            return L.divIcon({
                                html: '<div style="background:#1da1f2;color:#fff;border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;">' + count + '</div>',
                                className: 'custom-cluster-icon',
                                iconSize: L.point(size, size)
                            });
                        }
                    });
                    
                    window.currentMap.addLayer(window.currentMarkers);
                    updateLeafletMarkers(window.currentMap, geojson);
                }
            }
        });
        
        $('#marker-size').on('input', function() {
            const value = $(this).val();
            $('#marker-size-value').text(value + 'px');
            
            $('.marker-container > div').css({
                'width': value + 'px',
                'height': value + 'px',
                'font-size': Math.max(10, parseInt(value) * 0.34) + 'px'
            });
        });
        
        $('#marker-opacity').on('input', function() {
            const value = $(this).val();
            $('#marker-opacity-value').text(value);
            
            $('.marker-container').css('opacity', value);
        });
        
        $('#reset-view').on('click', function() {
            if (window.currentMap) {
                window.currentMap.setView([-1.9297706, 30.1272444], 2);
            }
        });
        
        $('#fit-bounds').on('click', function() {
            if (window.currentMap && window.currentMarkers) {
                const bounds = window.currentMarkers.getBounds();
                if (bounds.isValid()) {
                    window.currentMap.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        });
        

        function updateUTCDateTime() {
            const now = new Date();
            
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const year = now.getUTCFullYear();
            const dateString = month + '/' + day + '/' + year;
            
            $('#utc-date').text(dateString);
        }
        
        updateUTCDateTime();
        setInterval(updateUTCDateTime, 1000);
        
        function updateMapScale() {
            if (window.currentMap) {
                const zoom = window.currentMap.getZoom();
                const center = window.currentMap.getCenter();
                
                const lat = center.lat.toFixed(4);
                const lng = center.lng.toFixed(4);
                
                $('#current-zoom').text(zoom);
                $('#current-center').text(lat + '°, ' + lng + '°');
            }
        }
        
        if (window.currentMap) {
            window.currentMap.on('moveend', updateMapScale);
            window.currentMap.on('zoomend', updateMapScale);
            updateMapScale();
        } else {

            setTimeout(function() {
                if (window.currentMap) {
                    window.currentMap.on('moveend', updateMapScale);
                    window.currentMap.on('zoomend', updateMapScale);
                    updateMapScale();
                }
            }, 1500);
        }
    });

</script>
